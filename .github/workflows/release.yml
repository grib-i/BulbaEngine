name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            dpkg-dev \
            nasm \
            libvulkan-dev \
            glslc \
            xorg-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Bootstrap vcpkg for static third-party libraries
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure with static vcpkg dependencies
        run: |
          PROJECT_DIR=.
          if [ ! -f "$PROJECT_DIR/CMakeLists.txt" ] && [ -f engine/CMakeLists.txt ]; then
            PROJECT_DIR=engine
          fi
          cmake -S "$PROJECT_DIR" -B build -G Ninja \
            "-DCMAKE_TOOLCHAIN_FILE=$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DPROJECT_NAME=BulbaEngine \
            -DCMAKE_BUILD_TYPE=Release \
            -DBLB_BUILD_SHARED=ON \
            -DBLB_BUILD_APP=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Package .deb
        run: cpack --config build/CPackConfig.cmake -G DEB

      - name: Upload Linux release files
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: build/packages/*.deb
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Build Windows release
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Vulkan SDK (includes glslc)
        uses: jakoch/install-vulkan-sdk-action@v1.7.0
        with:
          vulkan_version: 1.4.304.1
          install_runtime: true
          cache: true
          stripdown: true

      - name: Install NSIS
        uses: negrutiu/nsis-install@v2

      - name: Configure with static vcpkg dependencies
        shell: pwsh
        run: |
          if (Test-Path "CMakeLists.txt") {
            $projectDir = "."
          } elseif (Test-Path "engine/CMakeLists.txt") {
            $projectDir = "engine"
          } else {
            throw "Could not find CMakeLists.txt in repository root or engine/"
          }
          cmake -S $projectDir -B build -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DPROJECT_NAME=BulbaEngine `
            -DBLB_BUILD_SHARED=ON `
            -DBLB_BUILD_APP=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package Windows installer
        run: cpack --config build/CPackConfig.cmake -C Release -G NSIS

      - name: Upload Windows release files
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: build/packages/*.exe
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release and attach packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mapfile -t files < <(find release-assets -type f \( -name '*.deb' -o -name '*.exe' \) -print)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No .deb or .exe release files were found." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "BulbaEngine $GITHUB_REF_NAME" --generate-notes
