<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title" shape-rendering="crispEdges">
  <title id="title">BulbaEngine pixel cube</title>
  <defs>
    <linearGradient id="top" x1="8" y1="4" x2="56" y2="31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF0BD"/><stop offset=".62" stop-color="#F4C46A"/><stop offset="1" stop-color="#D9913A"/>
    </linearGradient>
    <linearGradient id="left" x1="8" y1="18" x2="32" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6C66F"/><stop offset="1" stop-color="#B66A2A"/>
    </linearGradient>
    <linearGradient id="right" x1="32" y1="32" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9903B"/><stop offset="1" stop-color="#78411F"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>
  <path d="M30 4h4v3h6v3h6v3h6v3h4v3h4v3h-4v3h-6v3h-6v3h-6v3h-4v-3h-6v-3h-6v-3h-6v-3h-4v-3h-4v-3h4v-3h6v-3h6v-3h6z" fill="#E5A04B" opacity=".16" filter="url(#glow)"/>
  <!-- Stepped side faces -->
  <path d="M8 16h4v3h6v3h6v3h6v3h2v30h-4v-3h-6v-3h-6v-3h-4v-3h-4z" fill="url(#left)" stroke="#F6C878" stroke-width="1"/>
  <path d="M56 16h4v27h-4v3h-4v3h-6v3h-6v3h-4v-3h-2V28h2v-3h6v-3h6v-3h6z" fill="url(#right)" stroke="#D58B3E" stroke-width="1"/>
  <!-- Shorter diamond top: the proportions match a classic isometric cube. -->
  <path d="M30 4h4v3h6v3h6v3h6v3h4v3h-4v3h-6v3h-6v3h-6v3h-4v-3h-6v-3h-6v-3h-6v-3h-4v-3h4v-3h6v-3h6v-3h6z" fill="url(#top)" stroke="#FFE6A2" stroke-width="1"/>
  <path d="M32 31v27" stroke="#FFE9AF" stroke-opacity=".72" stroke-width="1.5"/>
  <path d="M14 16h4v3h6v3h6v3h-4v-3h-6v-3h-6z" fill="#FFF5D4" opacity=".45"/>
  <path d="M42 31h4v-3h6v-3h4v3h-4v3h-6v3h-4z" fill="#4A2711" opacity=".24"/>
